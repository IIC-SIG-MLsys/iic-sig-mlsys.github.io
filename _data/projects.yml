- name: "异构加速器统一通信研究"
  id: hux
  description: "围绕异构算力协同与大模型推理，研究跨厂商互联、显存直传、流水线传输与拥塞控制，为单机及分布式人工智能系统提供高效、稳定的通信支撑。同时探索 CPU/GPU 协同执行，减少集合通信对 GPU 计算资源的占用。"
  image: "https://i.ibb.co/KxgX01zH/conn.png"
  highlights:
    - "异构互联：统一连接 NVIDIA、AMD/海光、寒武纪、摩尔线程、昆仑芯等加速器"
    - "高效传输：结合显存直传与双缓冲流水线，减少数据搬运开销、提升传输效率"
    - "拥塞优化：结合细粒度流量拆分与自适应拥塞控制，提升网络竞争下的传输稳定性"
    - "计算通信协同：结合异步传输与 CPU/GPU 协同调度，减少通信等待对 GPU 计算资源的占用"
  tech_stack:
    - "C++"
    - "Python"
    - "CUDA"
    - "ROCm"
    - "UCX"
    - "RDMA"
  github: "https://github.com/IIC-SIG-MLsys/HUX"
  related_repositories:
    - name: "HMC"
      url: "https://github.com/IIC-SIG-MLsys/HMC"
  start_date: "2024-09"
  end_date: ""
  status: "active"

- name: "KV Cache 管理与优化研究"
  id: distkv
  description: "面向大模型推理中的缓存复用、压缩与 I/O 瓶颈，研究 KV Cache 的组织、放置与生命周期管理。结合云原生部署和主流推理框架，优化缓存存储与访问效率，降低首 Token 时延和重复计算，提升单位缓存资源的服务能力。"
  image: "/assets/img/projects/distkv-architecture.svg"
  highlights:
    - "缓存复用：研究跨请求、跨实例的缓存共享与生命周期管理，兼顾容量管理与租户隔离"
    - "压缩优化：研究无损与有损 KV Cache 压缩，兼顾模型质量、缓存容量与传输效率"
    - "缓存放置与调度：研究缓存块在不同节点与存储层级间的放置、迁移和访问调度，提高缓存命中率与利用效率"
    - "存储与传输：探索分层存储、CXL 等新介质与 uGDS 等传输路径，降低缓存 I/O 开销"
  tech_stack:
    - "Python"
    - "Go"
    - "Kubernetes"
    - "Helm"
    - "vLLM"
    - "SGLang"
    - "llm-d"
  github: "https://github.com/IIC-SIG-MLsys/DistKV"
  start_date: "2026-04"
  end_date: ""
  status: "active"

- name: "智算云平台研究"
  id: beeqos
  description: "面向异构智算集群，研究 GPU 资源纳管与虚拟化、云网络资源保障及云平台架构，统一管理设备、集群容量和租户配额，支撑算力资源的分配、共享与回收。云网络与带宽保障相关成果发表于 ACM WWW 2026。"
  highlights:
    - "GPU 纳管与虚拟化：研究异构设备管理、资源切分与隔离，提升算力共享和利用效率"
    - "云流量管理：研究细粒度 QoS、多优先级带宽保障与混合业务流量调度"
    - "算力资源调度：研究多集群容量与租户配额协同管理，支撑设备资源分配、共享和回收"
    - "云平台研发：构建资源、任务与租户的统一视图，完善监控告警、权限管理与运维能力"
  github: "https://github.com/IIC-SIG-MLsys/BeeQos"
  start_date: "2025-09"
  end_date: ""
  status: "active"

- name: "大模型推理与服务系统研究"
  id: token-factory
  description: "面向大模型的高效运行与服务交付，研究国产 GPU 推理加速、模型实例弹性部署与请求路由，优化吞吐、响应时延和服务可用性。以统一 API 网关与 Token 服务平台为实践载体，打通模型调用、服务治理和用量管理。"
  highlights:
    - "国产 GPU 推理加速：结合模型与硬件特性优化推理执行，提升吞吐与长上下文服务效率"
    - "模型服务弹性部署：根据业务负载与时延目标调整模型实例规模和部署位置，协同模型加载与服务切换"
    - "统一 API 网关：研究多 IDC 服务接入、请求路由、鉴权配额与故障切换"
    - "Token 服务平台：统一模型调用与用量计量，支撑多租户服务管理、计费核对和运营"
  status: "active"
