- name: "异构加速器统一通信研究"
  id: hux
  description: "围绕异构算力协同与大模型推理，研究跨厂商互联、显存直传、流水线传输与拥塞控制，为单机及分布式人工智能系统提供高效、稳定的通信支撑。同时探索 CPU/GPU 协同执行，减少集合通信对 GPU 计算资源的占用。"
  image: "https://i.ibb.co/KxgX01zH/conn.png"
  highlights:
    - "异构互联：统一连接 NVIDIA、AMD/海光、寒武纪、摩尔线程、昆仑芯等加速器"
    - "高效传输：结合显存直传与双缓冲流水线，减少数据搬运开销、提升传输效率"
    - "拥塞优化：结合细粒度流量拆分与自适应拥塞控制，提升网络竞争下的传输稳定性"
    - "计算通信协同：结合异步传输与 CPU/GPU 协同调度，减少通信等待对 GPU 计算资源的占用"
  tech_stack:
    - "C++"
    - "Python"
    - "CUDA"
    - "ROCm"
    - "UCX"
    - "RDMA"
  start_date: "2024-09"
  end_date: ""
  status: "active"

- name: "KV Cache 管理与优化研究"
  id: distkv
  description: "面向长上下文与多轮交互，研究分布式 KV Cache 管理、复用与压缩，减少重复预填充和缓存访问开销。结合云原生架构与主流推理框架，协同优化缓存容量、传输与加载效率，改善长对话的缓存复用和尾延迟，提升单位缓存资源的服务能力。"
  image: "/assets/img/projects/distkv-architecture.svg"
  highlights:
    - "分布式缓存复用：分离缓存管理与数据传输，研究跨请求、跨实例复用与生命周期管理，改善多轮交互的缓存命中与尾延迟"
    - "压缩与加载协同：结合无损压缩与 token 重要性感知的有损压缩，权衡缓存体积、模型质量与加载时延"
    - "缓存放置与调度：研究按需一致性与分层缓存放置，权衡缓存传输、复用和重算成本"
    - "存储与传输：探索分层存储、CXL 等新介质与 uGDS 等传输路径，降低缓存 I/O 开销"
  tech_stack:
    - "Python"
    - "Go"
    - "Kubernetes"
    - "Helm"
    - "vLLM"
    - "SGLang"
    - "llm-d"
  start_date: "2026-04"
  end_date: ""
  status: "active"

- name: "智算云与大模型服务系统研究"
  id: cloud-inference
  description: "面向异构智算集群与大模型服务，研究从算力资源管理、云网络保障到推理执行优化和服务治理的系统协同，在模型效果、吞吐、时延与资源成本之间寻找更优平衡。结合爱特云翔一体化算力云平台（IaaS＋PaaS＋MaaS）合作，开展平台架构与关键模块研发，支撑国产算力上的模型运行与服务交付。"
  highlights:
    - "GPU 纳管与虚拟化：研究异构设备统一管理、GPU 共享与隔离，支撑多租户算力使用"
    - "云网络保障：基于 eBPF 研究需求感知、多优先级动态带宽分配与闲置带宽回收"
    - "算力资源调度：基于 Kubernetes，结合 LWS、Volcano 探索组级编排与拓扑感知分配，支撑多机多卡资源协同"
    - "资源池化与可靠存储：研究异构显存/内存共享与纠删码编码修复，优化资源利用和跨机架通信开销"
    - "国产平台推理优化：结合模型与设备特性优化算子执行、通信和缓存状态恢复，提升长上下文推理效率"
    - "并行策略与阶段协同：依据输入长度和互联条件选择 TP/PP 组合，优化 Prefill/Decode 间的缓存交接与流水线执行"
    - "大小模型协同：研究固定 GPU 预算下的混合部署，在模型效果、服务吞吐与响应时延之间寻找更优折中"
    - "模型服务弹性部署：根据业务负载与时延目标调整模型实例规模和部署位置，协同模型加载、扩缩容与服务切换"
    - "统一服务接入：研究多 IDC API 网关、请求路由、鉴权配额、健康检查与故障切换，提升服务可用性"
    - "云平台与服务治理：围绕资源、任务、租户和模型服务构建统一视图，开展监控告警、Token 计量及计费核对等模块研发"
  start_date: "2025-09"
  end_date: ""
  status: "active"
