- name: "异构加速器统一通信库"
  id: hux
  subtitle: "HUX (Heterogeneous Unified eXchange)"
  description: "面向异构 AI 加速器的点对点数据传输引擎，为 NVIDIA、AMD/海光、寒武纪、摩尔线程、昆仑芯等不同厂商的 GPU/XPU 以及 CPU 内存提供统一的数据交换接口，让上层推理与训练系统在混合硬件集群中无需针对每种设备单独适配通信。HUX 是 HMC 的下一代通信库。"
  start_date: "2026-09"
  end_date: ""
  status: "active"

- name: "分布式 KV Cache 系统"
  id: distkv
  subtitle: "DistKV"
  description: "面向大模型推理集群的分布式 KV Cache 基础设施，在多个推理实例与节点之间统一管理、卸载和复用 KV Cache，降低重复计算、缩短首 token 延迟。支持单机、多进程和 Kubernetes 集群部署，可与 vLLM 等主流推理引擎集成。"
  start_date: "2026-04"
  end_date: ""
  status: "active"

- name: "云原生多优先级带宽保障"
  id: beeqos
  subtitle: "BeeQoS"
  description: "面向 Kubernetes 集群的细粒度 QoS 与带宽管理系统，为不同优先级的业务提供自适应、可扩展的带宽保障。相关成果发表于 ACM WWW 2026。"
  github: "https://github.com/IIC-SIG-MLsys/BeeQos"
  start_date: "2025-09"
  end_date: ""
  status: "active"

- name: "异构 GPU 统一内存通信框架"
  id: hmc
  subtitle: "HMC (Heterogeneous Memory Communication)"
  description: "面向 CPU 与多种 GPU（NVIDIA、AMD、寒武纪、摩尔线程等）的统一通信框架，提供设备无关的内存管理与数据传输接口。HMC 是 HUX 的前身，已开源；相关成果 UHM 发表于 IEEE TC 2026。"
  github: "https://github.com/IIC-SIG-MLsys/HMC"
  start_date: "2024-09"
  end_date: "2026-09"
  status: "released"
