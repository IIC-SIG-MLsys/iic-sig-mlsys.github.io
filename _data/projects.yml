- name: "异构加速器统一通信库"
  id: hux
  subtitle: "HUX (Heterogeneous Unified eXchange) · 前身 HMC"
  description: "围绕异构算力协同与大模型推理，团队持续积累跨厂商互联、显存直传、流水线传输与拥塞控制技术，构建连接 CPU 与多厂商 GPU/XPU 的统一通信库，为单机及分布式人工智能系统提供高效、稳定的通信支撑。"
  image: "https://i.ibb.co/KxgX01zH/conn.png"
  highlights:
    - "异构互联：统一连接 NVIDIA、AMD/海光、寒武纪、摩尔线程、昆仑芯等加速器"
    - "高效传输：结合显存直传与双缓冲流水线，减少数据搬运开销、提升传输效率"
    - "拥塞优化：结合细粒度流量拆分与自适应拥塞控制，提升网络竞争下的传输稳定性"
    - "计算通信协同：通过异步批量传输与 GPU 流、事件协同，支持计算通信重叠"
  tech_stack:
    - "C++"
    - "Python"
    - "CUDA"
    - "ROCm"
    - "UCX"
    - "RDMA"
  github: "https://github.com/IIC-SIG-MLsys/HUX"
  related_repositories:
    - name: "HMC（前身）"
      url: "https://github.com/IIC-SIG-MLsys/HMC"
  start_date: "2024-09"
  end_date: ""
  status: "active"

- name: "DistKV：云原生KV Cache系统"
  id: distkv
  description: "面向大模型推理集群的分布式 KV Cache 基础设施，统一管理和复用推理缓存，减少重复预填充计算。通过控制与数据平面分离，支持从单机到 Kubernetes 集群的部署，并对接 vLLM 与 llm-d。"
  image: "/assets/img/projects/distkv-architecture.svg"
  highlights:
    - "灵活部署：支持单进程、多进程及 Kubernetes，兼容原生集群与 llm-d"
    - "职责分离：控制平面管理资源与放置，I/O Worker 执行缓存读写和后台复制"
    - "缓存池管理：统一管理内存与文件资源，支持运行时创建、移除缓存池"
    - "可扩展架构：通过可插拔控制平面拓展 KV Cache 管理策略"
  tech_stack:
    - "Python"
    - "Go"
    - "Kubernetes"
    - "Helm"
    - "vLLM"
    - "llm-d"
  github: "https://github.com/IIC-SIG-MLsys/DistKV"
  start_date: "2026-04"
  end_date: ""
  status: "active"

- name: "云原生多优先级带宽保障"
  id: beeqos
  subtitle: "BeeQoS"
