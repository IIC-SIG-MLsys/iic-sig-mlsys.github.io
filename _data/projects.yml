- name: "异构加速器统一通信库"
  id: hux
  subtitle: "HUX (Heterogeneous Unified eXchange) · 前身 HMC"
  description: "面向异构 AI 加速器的统一数据传输引擎，以一致接口连接 CPU 与多厂商 GPU/XPU，覆盖单机和跨节点通信，为人工智能系统提供通信基础。由 HMC 演进而来，HUX 支持直接注册应用内存，减少中间缓冲拷贝。"
  image: "https://i.ibb.co/KxgX01zH/conn.png"
  highlights:
    - "跨厂商互联：支持 NVIDIA、AMD/海光、寒武纪、摩尔线程、昆仑芯"
    - "统一传输：按设备与拓扑选择 RDMA、UCX 或进程间通信路径"
    - "异步协同：批量读写结合 GPU 流与事件，支持计算通信重叠"
    - "便捷集成：提供 C++ 与 Python 接口，对接应用已有内存"
  tech_stack:
    - "C++"
    - "Python"
    - "CUDA"
    - "ROCm"
    - "UCX"
    - "RDMA"
  github: "https://github.com/IIC-SIG-MLsys/HUX"
  related_repositories:
    - name: "HMC（前身）"
      url: "https://github.com/IIC-SIG-MLsys/HMC"
  start_date: "2024-09"
  end_date: ""
  status: "active"

- name: "分布式 KV Cache 系统"
  id: distkv
  subtitle: "DistKV"
  description: "面向大模型推理集群的分布式 KV Cache 基础设施，在多个推理实例与节点之间统一管理、卸载和复用 KV Cache，降低重复计算、缩短首 token 延迟。支持单机、多进程和 Kubernetes 集群部署，可与 vLLM 等主流推理引擎集成。"
  start_date: "2026-04"
  end_date: ""
  status: "active"

- name: "云原生多优先级带宽保障"
  id: beeqos
  subtitle: "BeeQoS"
  description: "面向 Kubernetes 集群的细粒度 QoS 与带宽管理系统，为不同优先级的业务提供自适应、可扩展的带宽保障。相关成果发表于 ACM WWW 2026。"
  github: "https://github.com/IIC-SIG-MLsys/BeeQos"
  start_date: "2025-09"
  end_date: ""
  status: "active"
