---
layout: default
---

{{ content }}

<h3 class="fw-bold border-bottom pb-3 mb-5">People</h3>

<div class="row g-4">
  {% for person in site.data.settings.people %}
  <!-- 整体：两列（每行两个人） -->
  <div class="col-12 col-md-6">
    <div class="border rounded-4 p-3 h-100" style="box-shadow: 0 2px 10px rgba(0,0,0,.06);">
      <!-- 局部：照片+文字 两列 -->
      <div class="row g-3 align-items-center">
        <!-- 左：照片 -->
        <div class="col-4">
          <img
            src="{{ person.image }}"
            alt="{{ person.name }}"
            style="width:100%; aspect-ratio:1/1; object-fit:cover; display:block; border-radius:0.75rem;"
          >
        </div>

        <!-- 右：文字 -->
        <div class="col-8">
          <h5 class="mb-2">{{ person.name }} {{ person.title }}</h5>
          <p class="mb-1">
            Email: <a href="mailto:{{ person.email }}">{{ person.email }}</a>
          </p>
          <p class="mb-0">
            <a href="{{ person.url }}" target="_blank" rel="noopener">个人主页</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
