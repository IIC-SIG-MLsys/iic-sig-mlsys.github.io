  <text x="566" y="525" text-anchor="middle" class="small">pools</text>
  <text x="350" y="594" text-anchor="middle">Node 1</text><text x="782" y="594" text-anchor="middle">Node N</text>

  <rect class="plugin" x="999" y="168" width="193" height="140"/>
