  <text x="1095" y="237" text-anchor="middle" class="label">Optional Go plugin</text>
  <text x="1095" y="269" text-anchor="middle" class="label">After source commit</text>
  <path class="edge" d="M946 232H995"/>
  <path class="edge" d="M1095 313V397"/>
  <text x="1109" y="354" class="small">Private RPC</text>
  <rect class="plugin" x="999" y="402" width="193" height="165"/>
  <text x="1095" y="435" text-anchor="middle" class="heading">C2C daemon</text>
  <text x="1095" y="468" text-anchor="middle" class="small">Own queue + projector</text>
  <text x="1095" y="500" text-anchor="middle" class="small">Source / target pools</text>
  <text x="1095" y="529" text-anchor="middle" class="label">via cache API</text>
  <text x="1095" y="552" text-anchor="middle" style="font-size:14px">Node-local · TP=1 · raw KV</text>
