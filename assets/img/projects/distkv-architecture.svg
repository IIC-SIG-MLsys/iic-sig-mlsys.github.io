<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
  <title id="title">DistKV control plane and data plane</title>
  <desc id="desc">The controller coordinates node cache servers. Each server manages memory and file resources in logical pool tiers. Python workers execute foreground connector I/O and background tasks. TCP and UCCL connect single-memory pools across nodes. An optional C2C hook submits projection to a separate daemon using the same cache API.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#344563"/></marker>
    <marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="#344563"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; font-size: 21px; }
      .label { font-size: 17px; }
      .small { font-size: 16px; }
      .heading { font-size: 23px; font-weight: 600; }
      .edge { fill: none; stroke: #344563; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#back); }
      .node { fill: #fff; stroke: #243858; stroke-width: 2; }
      .control { fill: #dbe7fa; stroke: #426bab; stroke-width: 2; }
      .data { fill: #e2efd8; stroke: #629346; stroke-width: 2; }
      .plugin { fill: #fff1c4; stroke: #b58b24; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1240" height="650" fill="#fff"/>
  <rect x="22" y="20" width="1196" height="332" fill="none" stroke="#9dbfeb" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="22" y="362" width="1196" height="266" fill="none" stroke="#a8ca91" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="42" y="190">Control</text><text x="42" y="218">plane</text>
  <text x="42" y="472">Data</text><text x="42" y="500">plane</text>
  <rect x="174" y="38" width="1018" height="52" fill="#4778bf" stroke="#243858" stroke-width="2"/>
  <text x="683" y="71" text-anchor="middle" style="fill:#fff" class="heading">CacheServerController · membership, lookup, placement</text>

  <rect class="node" x="174" y="140" width="352" height="468"/>
  <rect class="node" x="606" y="140" width="352" height="468"/>
  <path class="edge" d="M342 95V136"/><path class="edge" d="M358 136V95"/>
  <path class="edge" d="M774 95V136"/><path class="edge" d="M790 136V95"/>
  <text x="367" y="119" class="label">RPC</text><text x="799" y="119" class="label">RPC</text>

  <rect class="control" x="190" y="156" width="320" height="180"/>
  <text x="350" y="187" text-anchor="middle" class="heading">Cache Server (Go)</text>
  <text x="350" y="223" text-anchor="middle">Pool · logical L1 / L2 / L3</text>
  <text x="350" y="253" text-anchor="middle">Storage · memory / files</text>
  <text x="350" y="286" text-anchor="middle" class="label">Policy · placement, eviction, tiering</text>
  <text x="350" y="315" text-anchor="middle" class="label">Tasks · queue, sessions, status</text>
  <rect class="control" x="622" y="156" width="320" height="180"/>
  <text x="782" y="187" text-anchor="middle" class="heading">Cache Server (Go)</text>
  <text x="782" y="223" text-anchor="middle">Pool · logical L1 / L2 / L3</text>
  <text x="782" y="253" text-anchor="middle">Storage · memory / files</text>
  <text x="782" y="286" text-anchor="middle" class="label">Policy · placement, eviction, tiering</text>
  <text x="782" y="315" text-anchor="middle" class="label">Tasks · queue, sessions, status</text>

  <path class="edge" d="M342 340V389"/><path class="edge" d="M358 389V340"/>
  <path class="edge" d="M774 340V389"/><path class="edge" d="M790 389V340"/>
  <text x="367" y="367" class="small">RPC / descriptors</text><text x="799" y="367" class="small">RPC / descriptors</text>
  <rect class="data" x="190" y="394" width="320" height="173"/>
  <text x="350" y="426" text-anchor="middle" class="heading">Python worker</text>
  <text x="350" y="458" text-anchor="middle">vLLM / SGLang adapter</text>
  <text x="350" y="491" text-anchor="middle">I/O execution threads</text>
  <text x="350" y="523" text-anchor="middle" class="label">GPU↔CPU · file · TCP · UCCL</text>
  <text x="350" y="550" text-anchor="middle" class="small">Foreground priority within the worker</text>
  <rect class="data" x="622" y="394" width="320" height="173"/>
  <text x="782" y="426" text-anchor="middle" class="heading">Python worker</text>
  <text x="782" y="458" text-anchor="middle">vLLM / SGLang adapter</text>
