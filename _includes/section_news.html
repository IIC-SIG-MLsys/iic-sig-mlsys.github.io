{% if site.data.site.news.enabled %}
<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h3 class="fw-bold border-bottom pb-3 mb-5">新闻</h3>
    {% for post in site.posts limit:site.data.site.news.max_display %}
      <p><a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%Y年%-m月%-d日" }}</p>
    {% endfor %}
  </div>
</div>
{% endif %}
