<footer class="site-footer">
  <div class="row">
    <div class="col-md-6">
      <p class="mb-1 fw-semibold" style="color: #0f172a;">{{ site.data.site.lab.name }}</p>
      <p class="mb-0">{{ site.data.site.lab.name_en }}</p>
      <p class="mb-0">{{ site.data.site.lab.institution }} · {{ site.data.site.lab.campus }}</p>
    </div>
    <div class="col-md-6 text-md-end mt-3 mt-md-0">
      <div class="mb-2">
        {% for item in site.data.settings.social %}
          <a href="{{ item.link }}" target="_blank" rel="noopener" class="social-icon me-2 text-decoration-none">
            <i class="fab fa-{{ item.icon }}"></i>
          </a>
        {% endfor %}
      </div>
      <p class="mb-0">&copy; {{ site.time | date: "%Y" }} SAIL</p>
    </div>
  </div>
</footer>
